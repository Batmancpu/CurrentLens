name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time for this repository.
concurrency:
  group: currentlens-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CurrentLens-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build-${{ github.run_number }}
          name: CurrentLens v0.1.0 (Build ${{ github.run_number }})
          body: |
            Installable debug APK for testing.

            Package: com.mangoloads.currentlens
            Version: 0.1.0
            This is a test build. Do not use as a production release.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
