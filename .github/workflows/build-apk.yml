name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: currentlens-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CurrentLens-v0.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-build-${{ github.run_number }}
          name: CurrentLens v0.2.0 (Build ${{ github.run_number }})
          body: |
            CurrentLens v0.2.0 testing build.
            Package: com.mangoloads.currentlens
            Includes the four-tab editorial redesign, Prismal AGSL glass controls, a 30-day local article metadata cache,
            Express Sunday Eye RSS, best-effort public-page extraction with in-app publisher fallback, and dictionary selection.
            Debug-signed APK for testing; not a production or Play Store release.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
