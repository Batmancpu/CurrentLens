name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/early-startup-crash-diagnostics-2026-11-06
      - black-box-bihar-news
  pull_request:
    branches:
      - main
      - fix/early-startup-crash-diagnostics-2026-11-06
      - black-box-bihar-news
    types: [ opened, synchronize, reopened, ready_for_review ]

# Build and test jobs are read-only. Release write access is isolated below.
permissions:
  contents: read

concurrency:
  group: currentlens-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Stability test signing key
        if: github.ref != 'refs/heads/main'
        id: stability-signing-cache
        uses: actions/cache@v4
        with:
          path: .ci/stability-debug.keystore
          key: currentlens-stability-debug-keystore-v1

      - name: Generate Stability test signing key on cache miss
        if: github.ref != 'refs/heads/main' && steps.stability-signing-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci
          keytool -genkeypair -noprompt -v -keystore .ci/stability-debug.keystore -storetype JKS -storepass currentlens-stability-test-only -keypass currentlens-stability-test-only -alias currentlens-stability -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CurrentLens Stability Debug,O=CurrentLens,C=IN"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Prepare stable APK signing identity
        shell: bash
        env:
          CURRENTLENS_RELEASE_KEYSTORE_BASE64: ${{ secrets.CURRENTLENS_RELEASE_KEYSTORE_BASE64 }}
          CURRENTLENS_RELEASE_STORE_PASSWORD: ${{ secrets.CURRENTLENS_RELEASE_STORE_PASSWORD }}
          CURRENTLENS_RELEASE_KEY_ALIAS: ${{ secrets.CURRENTLENS_RELEASE_KEY_ALIAS }}
          CURRENTLENS_RELEASE_KEY_PASSWORD: ${{ secrets.CURRENTLENS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            : "${CURRENTLENS_RELEASE_KEYSTORE_BASE64:?Missing GitHub Actions secret CURRENTLENS_RELEASE_KEYSTORE_BASE64}"
            : "${CURRENTLENS_RELEASE_STORE_PASSWORD:?Missing GitHub Actions secret CURRENTLENS_RELEASE_STORE_PASSWORD}"
            : "${CURRENTLENS_RELEASE_KEY_ALIAS:?Missing GitHub Actions secret CURRENTLENS_RELEASE_KEY_ALIAS}"
            : "${CURRENTLENS_RELEASE_KEY_PASSWORD:?Missing GitHub Actions secret CURRENTLENS_RELEASE_KEY_PASSWORD}"
            signing_keystore="$RUNNER_TEMP/currentlens-release.p12"
            printf '%s' "$CURRENTLENS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_keystore"
            test -s "$signing_keystore"
            keytool -list -keystore "$signing_keystore" -storepass "$CURRENTLENS_RELEASE_STORE_PASSWORD" -alias "$CURRENTLENS_RELEASE_KEY_ALIAS" >/dev/null
            chmod 600 "$signing_keystore"
            signing_store_password="$CURRENTLENS_RELEASE_STORE_PASSWORD"
            signing_key_alias="$CURRENTLENS_RELEASE_KEY_ALIAS"
            signing_key_password="$CURRENTLENS_RELEASE_KEY_PASSWORD"
          else
            signing_keystore="$GITHUB_WORKSPACE/.ci/stability-debug.keystore"
            test -s "$signing_keystore"
            signing_store_password="currentlens-stability-test-only"
            signing_key_alias="currentlens-stability"
            signing_key_password="currentlens-stability-test-only"
          fi
          {
            printf 'CURRENTLENS_SIGNING_KEYSTORE_PATH=%s\n' "$signing_keystore"
            printf 'CURRENTLENS_SIGNING_STORE_PASSWORD=%s\n' "$signing_store_password"
            printf 'CURRENTLENS_SIGNING_KEY_ALIAS=%s\n' "$signing_key_alias"
            printf 'CURRENTLENS_SIGNING_KEY_PASSWORD=%s\n' "$signing_key_password"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify dictionary builder and create offline WordNet database
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          archive="$RUNNER_TEMP/english-wordnet-2025-plus.zip"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 240 \
            "https://en-word.net/static/english-wordnet-2025-plus.zip" \
            --output "$archive"
          archive_bytes="$(stat -c%s "$archive")"
          test "$archive_bytes" -ge 5000000
          test "$archive_bytes" -le 25000000
          python3 scripts/build_wordnet_db.py "$archive" app/src/main/assets/wordnet.db \
            --min-unique-words 100000
          test -s app/src/main/assets/wordnet.db

      - name: Compile APK and run JVM tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            gradle --no-daemon --stacktrace -PrequireStableSigning=true :app:testDebugUnitTest :app:assembleDebug
          else
            gradle --no-daemon --stacktrace -PstabilityTest=true -PrequireStableSigning=true :app:testDebugUnitTest :app:assembleDebug
          fi

      - name: Verify APK signer matches configured keystore
        shell: bash
        run: bash scripts/verify_apk_signing.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CurrentLens-v0.2.8-stability-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish main-branch testing release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK built and tested by this workflow run
        uses: actions/download-artifact@v4
        with:
          name: CurrentLens-v0.2.8-stability-debug-apk
          path: release-assets

      - name: Publish direct APK download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.8-build-${{ github.run_number }}
          name: CurrentLens v0.2.8 (Build ${{ github.run_number }})
          body: |
            CurrentLens v0.2.8 testing build.
            Package: com.mangoloads.currentlens
            Includes the four-tab editorial redesign, Prismal AGSL glass controls, a 30-day local article metadata cache,
            Express Sunday Eye RSS, best-effort public-page extraction with in-app publisher fallback, offline WordNet definitions.
            Debug-build APK signed with the stable private key for update continuity; not a production or Play Store release.
          files: release-assets/app-debug.apk
          prerelease: true
          make_latest: false
