name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/early-startup-crash-diagnostics-2026-11-06

permissions:
  contents: write

concurrency:
  group: currentlens-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify dictionary builder and create offline WordNet database
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          archive="$RUNNER_TEMP/english-wordnet-2025-plus.zip"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 240 \
            "https://en-word.net/static/english-wordnet-2025-plus.zip" \
            --output "$archive"
          archive_bytes="$(stat -c%s "$archive")"
          test "$archive_bytes" -ge 5000000
          test "$archive_bytes" -le 25000000
          python3 scripts/build_wordnet_db.py "$archive" app/src/main/assets/wordnet.db \
            --min-unique-words 100000
          test -s app/src/main/assets/wordnet.db

      - name: Compile APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          else
            gradle --no-daemon --stacktrace -PstabilityTest=true :app:testDebugUnitTest :app:assembleDebug
          fi

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CurrentLens-v0.2.1-stability-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download in GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1-build-${{ github.run_number }}
          name: CurrentLens v0.2.1 (Build ${{ github.run_number }})
          body: |
            CurrentLens v0.2.1 testing build.
            Package: com.mangoloads.currentlens
            Includes the four-tab editorial redesign, Prismal AGSL glass controls, a 30-day local article metadata cache,
            Express Sunday Eye RSS, best-effort public-page extraction with in-app publisher fallback, offline WordNet definitions.
            Debug-signed APK for testing; not a production or Play Store release.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
